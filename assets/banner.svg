<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Shayman McGee — the curious builder</title>
<desc id="desc">Curious by nature. Creative by instinct. Analytical by choice. An animated network connects curiosity, creativity and engineering.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1526"/><stop offset="1" stop-color="#142b3c"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#73e2d0"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#9cb4cf" stroke-opacity=".065"/></pattern>
<style>
text{font-family:Segoe UI,Arial,sans-serif}
.mono{font-family:Consolas,monospace;letter-spacing:2px}
.flow{stroke-dasharray:5 13;animation:flow 9s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b{animation-delay:-1.7s}.c{animation-delay:-3.3s}
@keyframes flow{to{stroke-dashoffset:-180}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.9)}50%{opacity:.8;transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style>
</defs>
<rect width="1200" height="310" rx="18" fill="url(#bg)"/>
<rect width="1200" height="310" rx="18" fill="url(#grid)"/>
<path d="M0 309H1200" stroke="url(#accent)" stroke-width="3"/>
<rect x="44" y="43" width="7" height="7" rx="2" fill="#73e2d0"/>
<text x="65" y="51" font-size="12" fill="#b2c6d8" class="mono">THE CURIOUS BUILDER</text>
<text x="44" y="117" font-size="53" font-weight="700" letter-spacing="-1.8" fill="#f0f6fc">Shayman McGee</text>
<text x="46" y="159" font-size="20" fill="#b2c6d8">Curious by nature. Creative by instinct.</text>
<text x="46" y="188" font-size="20" fill="#b2c6d8">Analytical by choice.</text>
<text x="46" y="253" font-size="12" fill="#73e2d0" class="mono">SOFTWARE / SYSTEMS / CREATIVE WORK</text>
<g fill="none" stroke="#66849b" stroke-width="1.5">
<path d="M810 84L1060 104L942 231Z"/>
<path d="M810 84L942 151L1060 104M942 151V231"/>
</g>
<g fill="none" stroke="#73e2d0" stroke-width="2" class="flow">
<path d="M810 84L942 151L1060 104"/>
<path d="M942 151V231L810 84"/>
</g>
<g fill="#73e2d0"><circle class="pulse" cx="810" cy="84" r="18" fill-opacity=".18"/><circle cx="810" cy="84" r="5"/></g>
<g fill="#a5b4fc"><circle class="pulse b" cx="1060" cy="104" r="18" fill-opacity=".18"/><circle cx="1060" cy="104" r="5"/></g>
<g fill="#73b9ed"><circle class="pulse c" cx="942" cy="231" r="18" fill-opacity=".18"/><circle cx="942" cy="231" r="5"/></g>
<circle cx="942" cy="151" r="10" fill="#142b3c" stroke="#d3e8f7" stroke-width="2"/>
<circle cx="942" cy="151" r="3" fill="#d3e8f7"/>
<g font-size="11" fill="#b2c6d8" class="mono"><text x="765" y="55">CURIOSITY</text><text x="1010" y="77">CREATIVITY</text><text x="883" y="271">ENGINEERING</text></g>
</svg>
